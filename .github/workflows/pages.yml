name: Test and deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: JavaScript regression tests
        run: node --test test_*.mjs
      - name: Install FFmpeg if needed
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y ffmpeg)
      - name: Local video pipeline tests
        run: python3 -m unittest -v test_editor.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public app only
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
